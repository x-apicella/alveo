# Local development: run Postgres and LiveKit, then `pnpm dev` on the host.
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: alveo
      POSTGRES_PASSWORD: alveo
      POSTGRES_DB: alveo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  livekit:
    image: livekit/livekit-server:v1.9
    command: --config /etc/livekit.yaml
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro

volumes:
  pgdata:
