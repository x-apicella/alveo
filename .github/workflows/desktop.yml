name: Desktop
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  shell:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:install
      - if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:desktop
      - if: runner.os == 'Windows'
        run: pnpm test:desktop
