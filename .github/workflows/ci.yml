name: CI
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 15
    outputs:
      image: ${{ steps.publish.outputs.image }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alveo
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: alveo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alveo -d alveo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ALVEO_DATABASE_URL: postgres://alveo:ci-password@localhost:5432/alveo
      SESSION_SECRET: ci-only-session-secret-not-for-deployment
      DND_AUTH_SHARED_SECRET: ci-only-sso-secret-not-for-deployment
      NEXT_PUBLIC_LIVEKIT_URL: ws://localhost:7880
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - name: Validate VPS proxy, Compose, and media server startup
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/vps/bootstrap.sh scripts/package-vps.sh
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { configs } from './scripts/prepare-vps.mjs';
          const {app, livekit, caddy} = configs({
            ALVEO_DATABASE_URL: process.env.ALVEO_DATABASE_URL,
            ALVEO_DATABASE_DIRECT_URL: process.env.ALVEO_DATABASE_URL,
            NEON_AUTH_URL: 'https://auth.example.invalid/auth',
          });
          // CI validates routing without requesting real certificates or public ICE candidates.
          caddy.apps.tls.certificates.automate = [];
          livekit.rtc.use_external_ip = false;
          mkdirSync('.deploy', {recursive:true, mode:0o700});
          writeFileSync('.deploy/app.env', Object.entries(app).map(([k,v])=>`${k}=${v}`).join('\n'), {mode:0o600});
          writeFileSync('.deploy/livekit.json', JSON.stringify(livekit), {mode:0o600});
          writeFileSync('.deploy/caddy.json', JSON.stringify(caddy), {mode:0o600});
          NODE
          docker compose -f deploy/vps/compose.yaml config --quiet
          docker compose -f deploy/vps/compose.yaml run --rm --no-deps caddy validate --config /etc/caddy.json
          trap 'docker compose -f deploy/vps/compose.yaml stop livekit redis' EXIT
          docker compose -f deploy/vps/compose.yaml up -d redis livekit
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:7880/ >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
      - run: pnpm build
      - run: pnpm typecheck
      - name: Build deployable image
        run: docker build --label org.opencontainers.image.revision="$GITHUB_SHA" --build-arg NEXT_PUBLIC_LIVEKIT_URL=wss://livekit.alveo.chat -t alveo:ci .
      - name: Verify container startup and automatic migrations
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name alveo-smoke --network host \
            -e ALVEO_DATABASE_URL -e SESSION_SECRET -e DND_AUTH_SHARED_SECRET -e NEXT_PUBLIC_LIVEKIT_URL \
            -e ALLOW_DEV_LOGIN=true alveo:ci
          docker run -d --name alveo-smoke-secondary --network host \
            -e ALVEO_DATABASE_URL -e SESSION_SECRET -e DND_AUTH_SHARED_SECRET -e NEXT_PUBLIC_LIVEKIT_URL \
            -e PORT=3001 alveo:ci
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health > /tmp/health.json && \
               curl --fail --silent http://localhost:3001/api/health > /tmp/health-secondary.json; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          # Production must reject dev login even if accidentally enabled.
          status=$(curl --silent -o /tmp/dev-login.json -w '%{http_code}' \
            -H 'Content-Type: application/json' -d '{"username":"smoke"}' \
            http://localhost:3000/api/auth/dev-login)
          test "$status" = 403
          docker exec ${{ job.services.postgres.id }} psql -U alveo -d alveo \
            -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM users;'
      - name: Verify deployment controller is bound to the tested image
        run: |
          docker cp alveo-smoke:/opt/alveo-release /tmp/alveo-verified-release
          for file in scripts/release-vps.mjs deploy/vps/compose.yaml deploy/vps/release.compose.yaml deploy/rollback-policy.json; do
            cmp "$file" "/tmp/alveo-verified-release/$file"
          done
      - name: Verify private deployment fixture is idempotent
        run: |
          docker exec -i alveo-smoke node --input-type=module - < scripts/provision-release-smoke.mjs > /tmp/smoke-ids-first.json
          docker exec -i alveo-smoke node --input-type=module - < scripts/provision-release-smoke.mjs > /tmp/smoke-ids-second.json
          cmp /tmp/smoke-ids-first.json /tmp/smoke-ids-second.json
      - run: pnpm check:services
      - run: pnpm test:smoke
        env:
          SMOKE_EVENTS_URL: http://localhost:3001
      - run: node scripts/chat-recovery-smoke.mjs
        env:
          SMOKE_EVENTS_URL: http://localhost:3001
      - run: node scripts/invite-smoke.mjs
        env:
          SMOKE_EVENTS_URL: http://localhost:3001
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - name: Publish the verified main image
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          image="ghcr.io/x-apicella/alveo:$GITHUB_SHA"
          docker tag alveo:ci "$image"
          docker push "$image"
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          printf 'image=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Verified release: `%s`\n\nCommit: `%s`\n' "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Container logs
        if: always()
        run: |
          docker logs alveo-smoke 2>&1 || true
          docker logs alveo-smoke-secondary 2>&1 || true

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://alveo.chat
    concurrency:
      group: alveo-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Check this commit is still main
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer main commit supersedes this release." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy verified image and check rollback gates
        if: steps.current.outputs.deploy == 'true'
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_IMAGE: ${{ needs.verify.outputs.image }}
          RELEASE_REVISION: ${{ github.sha }}
        run: bash scripts/deploy-via-ssh.sh
      - name: Check public availability
        if: steps.current.outputs.deploy == 'true'
        run: |
          curl --fail --silent --show-error --retry 3 --max-time 15 https://alveo.chat/api/health
          printf 'Deployed commit: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
